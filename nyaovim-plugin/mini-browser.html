<dom-module id="mini-browser">
  <template>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/font-awesome/4.5.0/css/font-awesome.min.css">
    <style>
      :host {
        display: block;
        height: 100%;
      }
      #mini-browser-body {
        display: none;
        height: 100%;
        width: 100%;
        flex-direction: column;
        font-family: Consolas,"Liberation Mono",Menlo,Courier,monospace;
      }
      #mini-browser-view {
        flex: auto;
        height: 100%;
        width: 100%;
        background-color: transparent;
      }
    </style>

    <div id="mini-browser-body">
      <webview id="mini-browser-view" allowpopups></webview>
    </div>
  </template>
</dom-module>

<script>
(function() {
  'use strict';

  Polymer({
    is: 'mini-browser',

    properties: {
      url: {
        type: String,
        value: ''
      },
      visible: {
        type: Boolean,
        value: false
      },
      width: {
        type: Number,
        value: 360    // Nexus5 width
      },
      height: {
        type: Number,
        value: 240
      },
      dock: {
        type: String,
        value: 'right'
      },
      matchActiveWindow: {
        type: Boolean,
        value: false
      },
      overlayMode: {
        type: Boolean,
        value: false,
        reflectToAttribute: true
      },
      externalControl: {
        type: Boolean,
        value: false,
        reflectToAttribute: true
      },
      overlayId: {
        type: String,
        value: ''
      },
      useragent: {
        type: String,
        value: function() {
          if (typeof navigator !== 'undefined' && navigator.userAgent) {
            return navigator.userAgent;
          }
          return 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/117.0.0.0 Safari/537.36';
        }
      },
      editor: Object
    },

    observers: [
      'onLayoutPropertyChange(width, height, dock, matchActiveWindow, visible)'
    ],

    ready: function() {
      this.body = this.$['mini-browser-body'];
      this.browser = this.$['mini-browser-view'];
      this.pendingWindowMetrics = null;
      this.windowResizeHandler = null;
      this._pendingOverlayOptions = this._pendingOverlayOptions || null;
      this._pendingOpen = this._pendingOpen || null;
      this.activeTarget = 'editor';
      this.isForeground = true;
      this.windowKeyHandler = null;
      this.lastReportedFocus = null;
      this.documentMouseDownHandler = null;
      this.suppressBrowserFocus = false;
      this.allowBrowserFocus = false;
      this.zoomFactor = 1;
      this.minZoomFactor = 0.25;
      this.maxZoomFactor = 3;
      this.zoomStep = 0.1;
      const {shell} = require('electron');
      this.body.setAttribute('tabindex', '-1');
      const preloadUrl = this.resolveUrl('mini-browser-preload.js');
      this.browser.setAttribute('preload', preloadUrl);
      this.browser.setAttribute('tabindex', '-1');
      this.applyLayout();
      const ua = this.useragent || (typeof navigator !== 'undefined' ? navigator.userAgent : '');
      if (typeof this.browser.setUserAgentOverride === 'function') {
        this.browser.setUserAgentOverride(ua);
      } else {
        this.browser.setAttribute('useragent', ua);
      }
      this.browser.useragent = ua;
      this.browser.src = this.url;
      this.browser.addEventListener('dom-ready', () => {
        if (typeof this.browser.getUserAgent === 'function') {
          const effectiveUA = this.browser.getUserAgent();
          console.info('[mini-browser] effective user agent:', effectiveUA);
        }
        const computedBackground = window.getComputedStyle(this).backgroundColor ||
          window.getComputedStyle(document.body).backgroundColor ||
          '#ffffff';
        if (typeof this.browser.setBackgroundColor === 'function') {
          this.browser.setBackgroundColor(computedBackground);
        }
        this.browser.style.backgroundColor = computedBackground;
        this.body.style.backgroundColor = computedBackground;
        this.browser.send('mini-browser:set-overlay-id', this.overlayId);
        if (typeof this.browser.getZoomFactor === 'function') {
          try {
            this.browser.getZoomFactor(factor => {
              if (typeof factor === 'number' && !Number.isNaN(factor)) {
                this.zoomFactor = factor;
              }
            });
          } catch (err) {
            console.warn('[mini-browser] getZoomFactor failed', err);
          }
        } else if (typeof this.browser.getZoomLevel === 'function') {
          try {
            this.browser.getZoomLevel(level => {
              if (typeof level === 'number' && !Number.isNaN(level)) {
                this.zoomFactor = this.zoomLevelToFactor(level);
              }
            });
          } catch (err) {
            console.warn('[mini-browser] getZoomLevel failed', err);
          }
        }
      });
      this.browser.addEventListener('did-finish-load', () => {
        if (this.suppressBrowserFocus && this.visible) {
          this.startFocusGuard('did-finish-load');
        }
      });
      this.browser.addEventListener('ipc-message', e => {
        if (e.channel === 'mini-browser:notification') {
          const payload = Array.isArray(e.args) ? e.args[0] : undefined;
          this.handleBrowserNotification(payload);
          return;
        }
        if (e.channel === 'mini-browser:toggle') {
          this.handleExternalFocusRequest('toggle');
          return;
        }
        if (e.channel === 'mini-browser:reload') {
          if (this.activeTarget !== 'browser') {
            return;
          }
          const payload = Array.isArray(e.args) ? e.args[0] : undefined;
          const ignoreCache =
            payload && typeof payload === 'object' ? !!payload.ignoreCache : false;
          this.reloadBrowser(ignoreCache);
          return;
        }
        if (e.channel === 'mini-browser:ctrl-w') {
          if (this.activeTarget !== 'browser') {
            return;
          }
          if (this.client && typeof this.client.input === 'function') {
            this.client
              .input('<C-w>')
              .catch(err => console.error('[mini-browser] forward ctrl-w failed', err));
          }
          setTimeout(() => this.focusEditor(), 0);
          return;
        }
        if (e.channel === 'mini-browser:history-back') {
          if (this.activeTarget !== 'browser') {
            return;
          }
          this.navigateBrowserHistory('back');
          return;
        }
        if (e.channel === 'mini-browser:history-forward') {
          if (this.activeTarget !== 'browser') {
            return;
          }
          this.navigateBrowserHistory('forward');
          return;
        }
        if (e.channel === 'mini-browser:zoom-in') {
          if (this.activeTarget !== 'browser') {
            return;
          }
          this.adjustZoom(1);
          return;
        }
        if (e.channel === 'mini-browser:zoom-out') {
          if (this.activeTarget !== 'browser') {
            return;
          }
          this.adjustZoom(-1);
          return;
        }
        if (e.channel === 'mini-browser:focus') {
          const focused = !!(e.args && e.args[0]);
          if (focused) {
            if (this.suppressBrowserFocus && !this.allowBrowserFocus) {
              if (this.browser && typeof this.browser.blur === 'function') {
                this.browser.blur();
              }
              this.focusEditor();
              return;
            }
            if (this.activeTarget !== 'browser') {
              this.activeTarget = 'browser';
              this.notifyFocusState('browser');
            }
          } else if (this.activeTarget !== 'editor') {
            this.focusEditor();
          }
        }
      });
      this.browser.addEventListener('did-fail-load', e => {
        console.error('[mini-browser] did-fail-load', e);
      });
      this.browser.addEventListener('new-window', e => {
        if (!e || !e.url) {
          return;
        }
        e.preventDefault();
        Promise.resolve(shell.openExternal(e.url)).catch(err => {
          console.error('[mini-browser] failed to open external url', e.url, err);
        });
      });
      this.browser.addEventListener('permissionrequest', event => {
        if (!event || !event.request) {
          return;
        }
        const permission = (event.permission || '').toLowerCase();
        if (permission === 'display-capture') {
          console.log('[mini-browser] allowing display capture', event.details);
          event.request.allow();
          return;
        }
        if (permission === 'notifications' || permission === 'notification') {
          console.log('[mini-browser] allowing notifications permission');
          event.request.allow();
          return;
        }
        if (permission === 'media') {
          const media = event.details && event.details.mediaTypes;
          const wantsVideo =
            media &&
            (media.video === true ||
              media.video === 'screen' ||
              media.video === 'window' ||
              media.video === 'tab');
          if (wantsVideo) {
            console.log('[mini-browser] allowing media capture', media);
            event.request.allow();
          }
        }
      });
      this.browser.addEventListener('focus', () => {
        if (this.suppressBrowserFocus && !this.allowBrowserFocus) {
          if (this.browser && typeof this.browser.blur === 'function') {
            this.browser.blur();
          }
          this.focusEditor();
          return;
        }
        this.activeTarget = 'browser';
        this.notifyFocusState('browser');
      });
      this.browser.addEventListener('blur', () => {
        if (this.activeTarget === 'browser') {
          this.activeTarget = 'editor';
          this.notifyFocusState('editor');
        }
      });
      this.documentMouseDownHandler = event => {
        if (!this.isForeground) {
          return;
        }
        const path = typeof event.composedPath === 'function' ? event.composedPath() : [];
        const insideBrowser =
          path.includes(this.browser) ||
          (this.body && (path.includes(this.body) || this.body.contains(event.target)));
        if (insideBrowser) {
          this.allowBrowserFocus = true;
          this.suppressBrowserFocus = false;
          this.focusBrowser();
        } else if (this.activeTarget !== 'editor') {
          this.allowBrowserFocus = false;
          this.activeTarget = 'editor';
          this.notifyFocusState('editor');
        }
      };
      document.addEventListener('mousedown', this.documentMouseDownHandler, true);
      this.browser.addEventListener('before-input-event', e => {
        if (!this.isForeground) {
          return;
        }
        if (this.handleZoomShortcut(e)) {
          return;
        }
        const key = e.key ? e.key.toLowerCase() : '';
        const code = e.code || '';
        if ((e.ctrlKey || e.metaKey) && (key === ']' || code === 'BracketRight')) {
          e.preventDefault();
          if (typeof e.stopPropagation === 'function') {
            e.stopPropagation();
          }
          this.sendToggleCommand();
          return;
        }
        if ((e.ctrlKey || e.metaKey) && (key === 'r' || code === 'KeyR')) {
          if (this.activeTarget !== 'browser') {
            return;
          }
          e.preventDefault();
          if (typeof e.stopPropagation === 'function') {
            e.stopPropagation();
          }
          e.returnValue = false;
          this.reloadBrowser(!!e.shiftKey);
          return;
        }
        if ((e.ctrlKey || e.metaKey) && (key === 'o' || code === 'KeyO')) {
          if (this.activeTarget !== 'browser') {
            return;
          }
          e.preventDefault();
          if (typeof e.stopPropagation === 'function') {
            e.stopPropagation();
          }
          e.returnValue = false;
          this.navigateBrowserHistory('back');
          return;
        }
        if ((e.ctrlKey || e.metaKey) && (key === 'i' || code === 'KeyI')) {
          if (this.activeTarget !== 'browser') {
            return;
          }
          e.preventDefault();
          if (typeof e.stopPropagation === 'function') {
            e.stopPropagation();
          }
          e.returnValue = false;
          this.navigateBrowserHistory('forward');
          return;
        }
        if ((e.ctrlKey || e.metaKey) && (key === 'w' || code === 'KeyW')) {
          if (this.activeTarget !== 'browser') {
            return;
          }
          e.preventDefault();
          if (typeof e.stopPropagation === 'function') {
            e.stopPropagation();
          }
          e.returnValue = false;
          if (this.client && typeof this.client.input === 'function') {
            this.client.input('<C-w>').catch(err => console.error('[mini-browser] forward ctrl-w failed', err));
          }
          // FIXME: this handoff still leaves edge-cases (e.g. chord timing)
          setTimeout(() => this.focusEditor(), 0);
        }
      });
      this.body.addEventListener('keydown', e => {
        if (!this.isForeground) {
          return;
        }
        if (this.handleZoomShortcut(e)) {
          return;
        }
        const key = e.key ? e.key.toLowerCase() : String.fromCharCode(e.keyCode).toLowerCase();
        const code = e.code || '';
        if ((e.ctrlKey || e.metaKey) && (key === ']' || code === 'BracketRight')) {
          e.preventDefault();
          this.sendToggleCommand();
          return;
        }
        if ((e.ctrlKey || e.metaKey) && (key === 'r' || code === 'KeyR')) {
          if (this.activeTarget !== 'browser') {
            return;
          }
          e.preventDefault();
          if (typeof e.stopPropagation === 'function') {
            e.stopPropagation();
          }
          e.returnValue = false;
          this.reloadBrowser(!!e.shiftKey);
          return;
        }
        if ((e.ctrlKey || e.metaKey) && (key === 'o' || code === 'KeyO')) {
          if (this.activeTarget !== 'browser') {
            return;
          }
          e.preventDefault();
          if (typeof e.stopPropagation === 'function') {
            e.stopPropagation();
          }
          e.returnValue = false;
          this.navigateBrowserHistory('back');
          return;
        }
        if ((e.ctrlKey || e.metaKey) && (key === 'i' || code === 'KeyI')) {
          if (this.activeTarget !== 'browser') {
            return;
          }
          e.preventDefault();
          if (typeof e.stopPropagation === 'function') {
            e.stopPropagation();
          }
          e.returnValue = false;
          this.navigateBrowserHistory('forward');
          return;
        }
        if ((e.ctrlKey || e.metaKey) && (key === 'w' || code === 'KeyW')) {
          if (this.activeTarget !== 'browser') {
            return;
          }
          e.preventDefault();
          if (typeof e.stopPropagation === 'function') {
            e.stopPropagation();
          }
          e.returnValue = false;
          // FIXME: minimal implementation; revisit timing if chord issues appear
          setTimeout(() => this.focusEditor(), 0);
        }
      });
      this.windowKeyHandler = e => {
        if (!this.visible || !this.isForeground || this.offsetParent === null) {
          return;
        }
        if (this.handleZoomShortcut(e)) {
          return;
        }
        if (!(e.ctrlKey || e.metaKey)) {
          return;
        }
        const key = e.key ? e.key.toLowerCase() : String.fromCharCode(e.keyCode).toLowerCase();
        if (key === ']') {
          e.preventDefault();
          if (typeof e.stopPropagation === 'function') {
            e.stopPropagation();
          }
          this.sendToggleCommand();
          return;
        }
        if (key === 'r') {
          if (this.activeTarget !== 'browser') {
            return;
          }
          e.preventDefault();
          if (typeof e.stopPropagation === 'function') {
            e.stopPropagation();
          }
          e.returnValue = false;
          this.reloadBrowser(!!e.shiftKey);
          return;
        }
        if (key === 'o') {
          if (this.activeTarget !== 'browser') {
            return;
          }
          e.preventDefault();
          if (typeof e.stopPropagation === 'function') {
            e.stopPropagation();
          }
          e.returnValue = false;
          this.navigateBrowserHistory('back');
          return;
        }
        if (key === 'i') {
          if (this.activeTarget !== 'browser') {
            return;
          }
          e.preventDefault();
          if (typeof e.stopPropagation === 'function') {
            e.stopPropagation();
          }
          e.returnValue = false;
          this.navigateBrowserHistory('forward');
          return;
        }
        if (key === 'w') {
          if (this.activeTarget !== 'browser') {
            return;
          }
          e.preventDefault();
          if (typeof e.stopPropagation === 'function') {
            e.stopPropagation();
          }
          e.returnValue = false;
          // FIXME: minimal Ctrl+W forwarding; editor focus may still flicker
          setTimeout(() => this.focusEditor(), 0);
        }
      };
      window.addEventListener('keydown', this.windowKeyHandler, true);
      if (this.visible) {
        this.show();
      }

      this.client = this.editor.getClient();
      if (!this.externalControl) {
        this.client.on('notification', this.legacyNotificationHandler.bind(this));
        this.client.subscribe('mini-browser:open');
        this.client.subscribe('mini-browser:close');
        this.client.subscribe('mini-browser:focus');
        this.windowResizeHandler = () => {
          if (this.matchActiveWindow && this.visible) {
            this.scheduleWindowMetricsRefresh();
          }
        };
        window.addEventListener('resize', this.windowResizeHandler);
      }

      if (this._pendingOverlayOptions) {
        const pending = this._pendingOverlayOptions;
        this._pendingOverlayOptions = null;
        this.applyOverlayOptionsNow(pending);
      }
      if (this._pendingOpen) {
        const pendingOpen = this._pendingOpen;
        this._pendingOpen = null;
        if (pendingOpen.url !== undefined) {
          this.browser.src = pendingOpen.url;
        }
        this.show(pendingOpen.focus);
      }
    },

    detached: function() {
      if (this.windowKeyHandler) {
        window.removeEventListener('keydown', this.windowKeyHandler, true);
        this.windowKeyHandler = null;
      }
      if (this.documentMouseDownHandler) {
        document.removeEventListener('mousedown', this.documentMouseDownHandler, true);
        this.documentMouseDownHandler = null;
      }
      if (this.externalControl) {
        if (this.pendingWindowMetrics) {
          clearTimeout(this.pendingWindowMetrics);
          this.pendingWindowMetrics = null;
        }
        return;
      }
      if (this.windowResizeHandler) {
        window.removeEventListener('resize', this.windowResizeHandler);
        this.windowResizeHandler = null;
      }
      if (this.pendingWindowMetrics) {
        clearTimeout(this.pendingWindowMetrics);
        this.pendingWindowMetrics = null;
      }
    },

    legacyNotificationHandler(method, args) {
      if (method === 'redraw') {
        if (this.matchActiveWindow && this.visible && this.shouldRefreshWindowMetrics(args)) {
          this.scheduleWindowMetricsRefresh();
        }
        return;
      }
      switch(method) {
        case 'mini-browser:open': {
          if (typeof args[0] === 'string') {
            this.open(args[0], args[1] === undefined || args[1]);
          } else {
            this.show(args[0] === undefined || args[0]);
          }
          break;
        }
        case 'mini-browser:close': {
          this.close();
          break;
        }
        case 'mini-browser:focus': {
          const target = Array.isArray(args) && args.length > 0 ? args[0] : undefined;
          this.handleExternalFocusRequest(target);
          break;
        }
      }
    },

    onLayoutPropertyChange() {
      if (!this.body) {
        return;
      }
      this.applyLayout();
      if (this.matchActiveWindow && this.visible) {
        this.scheduleWindowMetricsRefresh(true);
      }
    },

    applyLayout() {
      const dock = (this.dock || 'right').toLowerCase();
      const visible = this.visible;
      if (this.overlayMode) {
        this.body.style.flexDirection = 'column';
        this.body.style.height = '100%';
        this.body.style.width = '100%';
        this.body.style.display = visible ? 'flex' : 'none';
        this.style.display = visible ? 'block' : 'none';
        this.style.width = '100%';
        this.style.height = '100%';
        this.style.marginLeft = '0px';
        this.style.bottom = '0px';
        return;
      }
      if (dock === 'bottom') {
        this.body.style.flexDirection = 'column';
        this.body.style.height = this.height + 'px';
        if (!this.matchActiveWindow) {
          this.body.style.width = '100%';
          this.style.marginLeft = '0px';
        } else {
          this.body.style.width = this.width + 'px';
        }
        if (visible) {
          this.style.display = 'block';
          this.style.height = this.height + 'px';
          this.style.width = this.matchActiveWindow ? this.width + 'px' : '100%';
          this.style.bottom = '0px';
        } else {
          this.style.display = 'none';
          this.style.height = '0px';
          this.style.width = '0px';
          this.style.marginLeft = '0px';
          this.style.bottom = '0px';
        }
      } else {
        this.body.style.flexDirection = 'column';
        this.body.style.height = '100%';
        this.body.style.width = this.width + 'px';
        if (visible) {
          this.style.display = 'block';
          this.style.height = '100%';
          this.style.width = this.width + 'px';
        } else {
          this.style.display = 'none';
          this.style.height = '100%';
          this.style.width = '0px';
        }
        this.style.marginLeft = '0px';
        this.style.bottom = '0px';
      }
    },

    scheduleWindowMetricsRefresh(force) {
      if (!this.matchActiveWindow) {
        return;
      }
      if (!force && !this.visible) {
        return;
      }
      if (this.pendingWindowMetrics) {
        clearTimeout(this.pendingWindowMetrics);
      }
      const delay = force ? 0 : 100;
      this.pendingWindowMetrics = setTimeout(() => {
        this.pendingWindowMetrics = null;
        this.updateActiveWindowMetrics();
      }, delay);
    },

    shouldRefreshWindowMetrics(events) {
      if (!Array.isArray(events)) {
        return false;
      }
      for (const evt of events) {
        if (!Array.isArray(evt) || evt.length === 0) {
          continue;
        }
        const name = evt[0];
        if (name === 'win_pos' || name === 'win_resize' || name === 'grid_resize' || name === 'win_viewport') {
          return true;
        }
      }
      return false;
    },

    updateActiveWindowMetrics() {
      if (!this.matchActiveWindow || !this.visible) {
        return;
      }
      const dock = (this.dock || 'right').toLowerCase();
      if (dock !== 'bottom') {
        return;
      }
      const {width: charWidth} = this.getCharMetrics();
      if (!this.client) {
        return;
      }
      this.client.eval('[winwidth(0), win_screenpos(0)]').then(result => {
        if (!Array.isArray(result) || result.length < 2) {
          return;
        }
        const winWidthCols = Number(result[0]);
        const screenPos = Array.isArray(result[1]) ? result[1] : null;
        const offsetCols = screenPos && screenPos.length > 1 ? Math.max(0, Number(screenPos[1]) - 1) : 0;
        if (Number.isNaN(winWidthCols) || winWidthCols <= 0) {
          return;
        }
        const widthPx = Math.max(0, Math.round(winWidthCols * charWidth));
        const offsetPx = Math.max(0, Math.round(offsetCols * charWidth));
        this.body.style.width = widthPx + 'px';
        this.style.width = widthPx + 'px';
        this.style.marginLeft = offsetPx + 'px';
        this.style.height = this.height + 'px';
        this.style.bottom = '0px';
      }).catch(err => {
        console.error('[mini-browser] updateActiveWindowMetrics failed', err);
      });
    },

    getCharMetrics() {
      const screen = this.editor && this.editor.screen;
      const attrs = screen && screen.store && screen.store.font_attr;
      if (attrs) {
        const width = attrs.width || (attrs.draw_width / (window.devicePixelRatio || 1));
        const height = attrs.height || (attrs.draw_height / (window.devicePixelRatio || 1));
        return {
          width: width || 8,
          height: height || 16
        };
      }
      return {width: 8, height: 16};
    },

    reloadBrowser(ignoreCache) {
      if (!this.browser) {
        return;
      }
      const target = this.browser;
      try {
        if (ignoreCache && typeof target.reloadIgnoringCache === 'function') {
          target.reloadIgnoringCache();
          return;
        }
        if (typeof target.reload === 'function') {
          target.reload();
          return;
        }
        if (target.src) {
          target.src = target.src;
        }
      } catch (err) {
        console.error('[mini-browser] reload failed', err);
      }
    },

    navigateBrowserHistory(direction) {
      if (!this.browser) {
        return;
      }
      const target = this.browser;
      const goForward = direction === 'forward';
      try {
        if (goForward) {
          if (typeof target.canGoForward === 'function' && !target.canGoForward()) {
            return;
          }
          if (typeof target.goForward === 'function') {
            target.goForward();
          }
          return;
        }
        if (typeof target.canGoBack === 'function' && !target.canGoBack()) {
          return;
        }
        if (typeof target.goBack === 'function') {
          target.goBack();
        }
      } catch (err) {
        console.error('[mini-browser] history navigation failed', err, {direction});
      }
    },

    handleZoomShortcut(event) {
      if (!event || !this.browser || this.activeTarget !== 'browser' || !this.isForeground) {
        return false;
      }
      const keyRaw = event.key !== undefined ? String(event.key) : '';
      const key = keyRaw.toLowerCase();
      const code = event.code || '';
      const ctrlOrMeta = !!(event.ctrlKey || event.metaKey);
      if (!ctrlOrMeta) {
        return false;
      }
      const zoomIn =
        key === '+' ||
        key === '=' ||
        code === 'Equal' ||
        code === 'NumpadAdd';
      const zoomOut =
        key === '-' ||
        key === '_' ||
        code === 'Minus' ||
        code === 'NumpadSubtract';
      if (!zoomIn && !zoomOut) {
        return false;
      }
      const fallbackKey =
        key ||
        (typeof event.keyCode === 'number'
          ? String.fromCharCode(event.keyCode).toLowerCase()
          : '');
      const isZoomIn =
        zoomIn ||
        fallbackKey === '+' ||
        fallbackKey === '=';
      const isZoomOut =
        zoomOut ||
        fallbackKey === '-' ||
        fallbackKey === '_';
      if (!isZoomIn && !isZoomOut) {
        return false;
      }
      if (typeof event.preventDefault === 'function') {
        event.preventDefault();
      }
      if (typeof event.stopPropagation === 'function') {
        event.stopPropagation();
      }
      event.returnValue = false;
      this.adjustZoom(isZoomIn ? 1 : -1);
      return true;
    },

    adjustZoom(direction) {
      if (!this.browser) {
        return;
      }
      const step = Number.isFinite(Number(this.zoomStep)) ? Number(this.zoomStep) : 0.1;
      const current = Number.isFinite(Number(this.zoomFactor)) ? Number(this.zoomFactor) : 1;
      const next = current + step * direction;
      this.applyZoomFactor(next);
    },

    applyZoomFactor(factor) {
      if (!this.browser) {
        return;
      }
      const min = Number.isFinite(Number(this.minZoomFactor)) ? Number(this.minZoomFactor) : 0.25;
      const max = Number.isFinite(Number(this.maxZoomFactor)) ? Number(this.maxZoomFactor) : 3;
      const clamped = Math.min(max, Math.max(min, factor));
      const rounded = Math.round(clamped * 100) / 100;
      try {
        if (typeof this.browser.setZoomFactor === 'function') {
          this.browser.setZoomFactor(rounded);
          this.zoomFactor = rounded;
          return;
        }
        if (typeof this.browser.setZoomLevel === 'function') {
          const level = this.zoomFactorToLevel(rounded);
          this.browser.setZoomLevel(level);
          this.zoomFactor = rounded;
          return;
        }
        this.zoomFactor = rounded;
      } catch (err) {
        console.error('[mini-browser] set zoom failed', err);
      }
    },

    zoomFactorToLevel(factor) {
      const safeFactor = Number.isFinite(Number(factor)) && factor > 0 ? Number(factor) : 1;
      return Math.log(safeFactor) / Math.log(1.2);
    },

    zoomLevelToFactor(level) {
      if (!Number.isFinite(Number(level))) {
        return 1;
      }
      return Math.pow(1.2, Number(level));
    },

    focusBrowser() {
      if (!this.visible) {
        this.show(true);
        return;
      }
      this.allowBrowserFocus = true;
      this.suppressBrowserFocus = false;
      if (this.browser) {
        setTimeout(() => {
          if (this.browser && typeof this.browser.focus === 'function') {
            this.browser.focus();
          }
        }, 0);
      }
      this.activeTarget = 'browser';
      this.notifyFocusState('browser');
    },

    focusEditor() {
      if (this.editor && typeof this.editor.focus === 'function') {
        this.editor.focus();
      }
      this.allowBrowserFocus = false;
      this.activeTarget = 'editor';
      this.notifyFocusState('editor');
    },

    handleBrowserNotification(payload) {
      if (!this.client) {
        return;
      }
      const data = payload && typeof payload === 'object' ? payload : {};
      const title = typeof data.title === 'string' ? data.title : '';
      const body = typeof data.body === 'string' ? data.body : '';
      const explicitMessage = typeof data.message === 'string' ? data.message : '';
      const message =
        explicitMessage ||
        (title && body ? `${title}: ${body}` : title || body || '[mini-browser] Received notification');
      const level = Number.isFinite(Number(data.level)) ? Number(data.level) : 2;
      const options = {
        title: title || 'Mini Browser',
      };
      if (typeof data.icon === 'string' && data.icon) {
        options.icon = data.icon;
      }
      if (typeof data.tag === 'string' && data.tag) {
        const overlayTag = this.overlayId !== undefined && this.overlayId !== null ? String(this.overlayId) : '';
        options.replace = overlayTag ? `${overlayTag}:${data.tag}` : data.tag;
      }
      if (data.requireInteraction === true) {
        options.timeout = 0;
      } else if (Number.isFinite(Number(data.timeout))) {
        const timeout = Number(data.timeout);
        if (timeout >= 0) {
          options.timeout = timeout;
        }
      }
      this.sendVimNotification(message, level, options);
    },

    sendVimNotification(message, logLevel, opts) {
      if (!this.client) {
        return;
      }
      const level = Number.isFinite(Number(logLevel)) ? Number(logLevel) : 2;
      const options = Object.assign({title: 'Mini Browser'}, opts || {});
      const text = String(message);
      if (typeof this.client.request === 'function') {
        this.client
          .request('nvim_notify', [text, level, options])
          .catch(err => {
            console.warn('[mini-browser] nvim_notify failed', err);
          });
      }
      this.showNotificationEcho(text, level);
    },

    showNotificationEcho(message, logLevel) {
      if (!this.client || typeof this.client.command !== 'function') {
        return;
      }
      const level = Number.isFinite(Number(logLevel)) ? Number(logLevel) : 2;
      const highlight = level >= 4 ? 'ErrorMsg' : level >= 3 ? 'WarningMsg' : '';
      const expr = JSON.stringify(String(message));
      const parts = [];
      if (highlight) {
        parts.push(`echohl ${highlight}`);
      }
      parts.push(`echomsg ${expr}`);
      if (highlight) {
        parts.push('echohl None');
      }
      this.client.command(parts.join(' | ')).catch(err => {
        console.error('[mini-browser] echomsg notification failed', err, {message});
      });
    },

    notifyFocusState(state) {
      if (!this.client) {
        return;
      }
      const bufferId = Number(this.overlayId || this.editor?.buffer?.id || NaN);
      if (!Number.isFinite(bufferId)) {
        return;
      }
      const focusState = state === 'browser' ? 'browser' : 'editor';
      if (this.lastReportedFocus === focusState) {
        return;
      }
      const command = `call MiniBrowserNotifyFocus(${bufferId}, '${focusState}')`;
      this.client
        .command(command)
        .then(() => {
          this.lastReportedFocus = focusState;
        })
        .catch(err => console.error('[mini-browser] notify focus failed', err));
    },

    handleExternalFocusRequest(target) {
      const command = target === undefined ? 'toggle' : String(target).toLowerCase();
      if (!this.isForeground && command !== 'browser') {
        return;
      }
      switch (command) {
        case 'editor':
          this.focusEditor();
          break;
        case 'browser':
          this.focusBrowser();
          break;
        default:
          this.toggleFocusImpl();
          break;
      }
    },

    setOverlayOptions(options) {
      if (!options) {
        return;
      }
      this._pendingOverlayOptions = Object.assign({}, this._pendingOverlayOptions || {}, options);
      if (!this.body || !this.browser) {
        return;
      }
      const pending = this._pendingOverlayOptions;
      this._pendingOverlayOptions = null;
      this.applyOverlayOptionsNow(pending);
    },

    applyOverlayOptionsNow(options) {
      if (!options) {
        return;
      }
      if (options.overlayId !== undefined) {
        this.overlayId = String(options.overlayId);
      }
      if (options.url !== undefined && options.url !== this.url) {
        this.url = options.url;
        if (this.visible || this.overlayMode) {
          this.browser.src = this.url;
        }
      }
      if (options.width !== undefined) {
        this.width = Number(options.width);
      }
      if (options.height !== undefined) {
        this.height = Number(options.height);
      }
      if (options.matchActiveWindow !== undefined) {
        this.matchActiveWindow = !!options.matchActiveWindow;
      }
      if (options.overlayMode !== undefined) {
        this.overlayMode = !!options.overlayMode;
      }
      if (options.useragent !== undefined) {
        this.useragent = options.useragent;
        this.browser.useragent = this.useragent;
      }
      if (options.dock !== undefined) {
        this.dock = options.dock;
      }
      if (options.visible === true) {
        this.show(options.focus === undefined ? false : !!options.focus);
      } else if (options.visible === false) {
        this.close();
      }
      if (options.foreground !== undefined) {
        this.setOverlayForeground(options.foreground);
      }
    },

    setOverlayForeground(foreground) {
      this.isForeground = !!foreground;
      if (!this.isForeground && this.activeTarget === 'browser') {
        this.focusEditor();
      } else if (this.isForeground) {
        this.notifyFocusState(this.activeTarget === 'browser' ? 'browser' : 'editor');
      } else {
        this.notifyFocusState('editor');
      }
    },

    show(focus) {
      if (!this.visible) {
        this.body.style.display = 'flex';
        this.visible = true;
        this.applyLayout();
        this.scheduleWindowMetricsRefresh(true);
        if (!this.overlayMode) {
          this.editor.screen.checkShouldResize();
        }
        this.isForeground = true;
      }
      if (focus) {
        this.allowBrowserFocus = true;
        this.suppressBrowserFocus = false;
        if (this.browser && typeof this.browser.focus === 'function') {
          this.browser.focus();
        }
        if (this.body && typeof this.body.focus === 'function') {
          this.body.focus();
        }
        this.activeTarget = 'browser';
        this.notifyFocusState('browser');
      } else {
        this.allowBrowserFocus = false;
        this.suppressBrowserFocus = true;
        if (this.browser && typeof this.browser.blur === 'function') {
          this.browser.blur();
        }
        this.focusEditor();
        this.startFocusGuard('show');
        this.activeTarget = 'editor';
        this.notifyFocusState('editor');
      }
    },

    open(url, focus) {
      if (!this.body || !this.browser) {
        this._pendingOpen = {
          url,
          focus,
        };
        if (url !== undefined) {
          this.url = url;
        }
        return;
      }
      this.browser.src = url;
      this.show(focus);
      if (!focus) {
        this.startFocusGuard('open');
      }
    },

    startFocusGuard(reason) {
      if (!this.suppressBrowserFocus) {
        return;
      }
      if (this._focusGuardTimer) {
        clearTimeout(this._focusGuardTimer);
        this._focusGuardTimer = null;
      }
      let attempts = 0;
      const tick = () => {
        if (!this.suppressBrowserFocus) {
          return;
        }
        attempts += 1;
        this.focusEditor();
        if (attempts < 6) {
          this._focusGuardTimer = setTimeout(tick, 75);
        }
      };
      tick();
    },

    close() {
      if (this.visible) {
        if (!this.overlayMode) {
          this.browser.src = '';
        }
        this.body.style.display = 'none';
        this.visible = false;
        this.applyLayout();
        if (!this.overlayMode) {
          this.editor.screen.checkShouldResize();
        }
        this.editor.focus();
        this.activeTarget = 'editor';
        this.isForeground = false;
        this.notifyFocusState('editor');
      }
      if (this.documentMouseDownHandler) {
        document.removeEventListener('mousedown', this.documentMouseDownHandler, true);
        this.documentMouseDownHandler = null;
      }
    },

    sendToggleCommand() {
      if (!this.isForeground || this.offsetParent === null) {
        return;
      }
      if (this.activeTarget === 'browser') {
        this.toggleFocusImpl();
        return;
      }
      console.log('[mini-browser] sendToggleCommand', {overlayId: this.overlayId});
      if (this.client) {
        this.client.command('MiniBrowserToggleFocus').catch(err => console.error('[mini-browser] toggle command failed', err));
      }
    },

    toggleFocusImpl() {
      if (!this.visible || !this.isForeground || this.offsetParent === null) {
        return;
      }
      if (this.activeTarget === 'browser') {
        this.focusEditor();
      } else {
        this.focusBrowser();
      }
    }
  });
})();
</script>
